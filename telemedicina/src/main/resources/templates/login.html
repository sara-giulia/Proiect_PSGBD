<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - TeleMed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a5cbf 0%, #2c7be5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .logo {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        h2 {
            text-align: center;
            color: #2c7be5;
            margin-bottom: 0.3rem;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        label {
            display: block;
            color: #555;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }
        input[type=email], input[type=password] {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: border 0.2s;
        }
        input:focus { outline: none; border-color: #2c7be5; }
        .role-select {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .role-btn {
            flex: 1;
            padding: 0.6rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: center;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .role-btn.active {
            border-color: #2c7be5;
            background: #e8f0fc;
            color: #2c7be5;
            font-weight: bold;
        }
        button[type=submit] {
            width: 100%;
            padding: 0.8rem;
            background: #2c7be5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type=submit]:hover { background: #1a5cbf; }
        .alert-error {
            background: #fdecea;
            border-left: 4px solid #e53935;
            padding: 0.8rem;
            border-radius: 8px;
            color: #b71c1c;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        input[name=role] { display: none; }
    </style>
</head>
<body>
<div class="card">
    <h2>TeleMed</h2>
    <p class="subtitle">Sistem de telemedicină</p>

    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/login}" method="post">
        <div class="role-select">
            <div class="role-btn active" id="btn-pacient" onclick="selectRole('pacient')">
                Pacient
            </div>
            <div class="role-btn" id="btn-doctor" onclick="selectRole('doctor')">
                Doctor
            </div>
        </div>
        <input type="hidden" name="role" id="role" value="pacient"/>

        <label>Email</label>
        <input type="email" name="email" required placeholder="email@exemplu.ro"/>

        <label>Parolă</label>
        <input type="password" name="password" required placeholder="••••••••"/>

        <button type="submit">Autentificare</button>
    </form>
    <div style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:#888;">
        Nu ai cont? <a href="/register" style="color:#2c7be5; text-decoration:none;">Inregistreaza-te</a>
    </div>
</div>

<script>
    function selectRole(role) {
        document.getElementById('role').value = role;
        document.getElementById('btn-pacient').classList.toggle('active', role === 'pacient');
        document.getElementById('btn-doctor').classList.toggle('active', role === 'doctor');
    }
</script>
</body>
</html>
